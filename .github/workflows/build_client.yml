name: Firmware build

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build_fw_builder:
    name: Build fw-builder Docker image
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.local-image.outputs.image_ref }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build Docker image for this workflow
        uses: docker/build-push-action@v7
        with:
          context: firmware
          tags: chameleonultra-fw-builder:pr
          outputs: type=docker,dest=${{ runner.temp }}/fw-builder.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Upload Docker image
        uses: actions/upload-artifact@v7
        with:
          name: firmware-builder-image
          path: ${{ runner.temp }}/fw-builder.tar
          retention-days: 1
      - name: Use local builder image
        id: local-image
        run: echo "image_ref=chameleonultra-fw-builder:pr" >> "$GITHUB_OUTPUT"

  build_fw:
    name: Build firmware
    runs-on: ubuntu-latest
    needs: build_fw_builder
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: firmware-builder-image
          path: ${{ runner.temp }}
      - name: Load Docker image
        run: docker load --input "${{ runner.temp }}/fw-builder.tar"
      - name: Build firmware
        run: |
          docker run --rm -v ${PWD}:/workdir -e CURRENT_DEVICE_TYPE=ultra "${{ needs.build_fw_builder.outputs.image_ref }}" firmware/build.sh
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ultra-firmware-dfu
          path: firmware/objects/ultra-dfu-app.zip
          
